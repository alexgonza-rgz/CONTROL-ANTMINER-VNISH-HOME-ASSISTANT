type: vertical-stack
cards:
  - type: markdown
    content: |
      # ⛏️ Antminer S19 Pro
      **VNish 1.3.5 · 192.168.1.108**

  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.vnish_disponible
        state: "off"
    card:
      type: markdown
      content: |
        ## ⚠️ Sin conexión
        Home Assistant no recibe respuesta del Antminer.

  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.vnish_sobretemperatura
        state: "on"
    card:
      type: markdown
      content: |
        ## 🔥 Sobretemperatura
        Se ha alcanzado el límite de seguridad configurado.

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: binary_sensor.vnish_disponible
        name: Conexión
        vertical: true
      - type: tile
        entity: binary_sensor.vnish_minando
        name: Minería
        vertical: true
      - type: tile
        entity: sensor.vnish_placas_activas
        name: Placas
        vertical: true

  - type: grid
    columns: 3
    square: false
    cards:
      - type: gauge
        entity: sensor.vnish_hashrate
        name: Hashrate
        min: 0
        max: 120
        needle: true
        severity:
          red: 0
          yellow: 40
          green: 55
      - type: gauge
        entity: sensor.vnish_temperatura_chips
        name: Chips
        min: 20
        max: 100
        needle: true
        severity:
          green: 20
          yellow: 75
          red: 90
      - type: gauge
        entity: sensor.vnish_ventiladores_porcentaje
        name: Ventiladores
        min: 0
        max: 100
        needle: true
        severity:
          green: 0
          yellow: 75
          red: 90

  - type: entities
    title: Resumen de funcionamiento
    show_header_toggle: false
    entities:
      - entity: sensor.vnish_estado_api
        name: Estado
      - entity: sensor.vnish_perfil_activo
        name: Perfil activo
      - entity: sensor.vnish_modo_reducido
        name: Throttle aplicado
      - entity: sensor.vnish_consumo
        name: Consumo
      - entity: sensor.vnish_eficiencia
        name: Eficiencia
      - entity: sensor.vnish_frecuencia_media
        name: Frecuencia media
      - entity: sensor.vnish_voltaje_medio
        name: Alimentación media de placas

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.vnish_placa_1_hashrate
        name: Placa 1
        vertical: true
      - type: tile
        entity: sensor.vnish_placa_2_hashrate
        name: Placa 2
        vertical: true
      - type: tile
        entity: sensor.vnish_placa_3_hashrate
        name: Placa 3
        vertical: true

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.vnish_ventilador_1_rpm
        name: Ventilador 1
      - type: tile
        entity: sensor.vnish_ventilador_2_rpm
        name: Ventilador 2
      - type: tile
        entity: sensor.vnish_ventilador_3_rpm
        name: Ventilador 3
      - type: tile
        entity: sensor.vnish_ventilador_4_rpm
        name: Ventilador 4

  - type: entities
    title: Configuración de ventiladores
    show_header_toggle: false
    entities:
      - entity: sensor.vnish_modo_ventiladores
        name: Modo actual
      - entity: sensor.vnish_ventiladores_porcentaje
        name: Duty actual
        icon: mdi:fan-speed-3
      - entity: sensor.vnish_temperatura_objetivo_ventiladores
        name: Objetivo actual
      - entity: input_number.vnish_ventilador_temperatura_objetivo
        name: Nueva temperatura objetivo
      - entity: input_number.vnish_ventilador_pwm_minimo
        name: PWM mínimo
      - entity: input_number.vnish_ventilador_pwm_maximo
        name: PWM máximo
      - entity: input_number.vnish_ventiladores_minimos
        name: Ventiladores mínimos

  - type: button
    entity: button.antminer_aplicar_ventiladores
    name: Aplicar configuración de ventiladores
    icon: mdi:fan-cog
    show_state: false
    tap_action:
      action: toggle
      confirmation:
        text: >-
          ¿Aplicar estos límites de ventilación? Un PWM máximo demasiado bajo
          puede provocar sobretemperatura.

  - type: entities
    title: Control diario
    show_header_toggle: false
    entities:
      - entity: switch.antminer_mineria
        name: Minería
      - entity: input_number.vnish_throttle
        name: Rendimiento solicitado
      - entity: button.antminer_aplicar_rendimiento
        name: Aplicar throttle
      - entity: input_boolean.vnish_proteccion_automatica
        name: Protección automática
      - entity: input_number.vnish_temperatura_limite
        name: Límite térmico

  - type: entities
    title: Perfil de potencia
    show_header_toggle: false
    entities:
      - type: section
        label: Perfiles altos requieren fuente y refrigeración adecuadas
      - entity: input_select.vnish_perfil_objetivo
        name: Perfil objetivo
      - entity: sensor.vnish_frecuencia_configurada
        name: Frecuencia del perfil
      - entity: sensor.vnish_voltaje_configurado
        name: Voltaje ASIC del perfil

  - type: button
    entity: button.antminer_aplicar_perfil
    name: Aplicar perfil seleccionado
    icon: mdi:tune-variant
    show_state: false
    tap_action:
      action: toggle
      confirmation:
        text: >-
          ¿Aplicar el perfil? Si todavía no está ajustado, VNish iniciará el
          autotune y reiniciará la minería.

  - type: entities
    title: Ajuste manual avanzado
    show_header_toggle: false
    entities:
      - type: section
        label: Al aplicar, desactiva el perfil y pasa a modo manual
      - entity: input_number.vnish_frecuencia_manual
        name: Frecuencia
      - entity: input_number.vnish_voltaje_manual
        name: Voltaje ASIC

  - type: button
    entity: button.antminer_aplicar_ajuste_manual
    name: Aplicar ajuste manual
    icon: mdi:engine
    show_state: false
    tap_action:
      action: toggle
      confirmation:
        text: >-
          ¿Desactivar el perfil y aplicar frecuencia y voltaje manuales?
          Un valor incorrecto puede causar inestabilidad o sobrecalentamiento.

  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        entity: button.antminer_reiniciar_backend
        name: Reiniciar minería
        icon: mdi:restart
        show_state: false
        tap_action:
          action: toggle
          confirmation:
            text: ¿Reiniciar el backend de minería?
      - type: button
        entity: button.antminer_reiniciar_equipo
        name: Reiniciar equipo
        icon: mdi:restart-alert
        show_state: false
        tap_action:
          action: toggle
          confirmation:
            text: ¿Reiniciar completamente el Antminer?
