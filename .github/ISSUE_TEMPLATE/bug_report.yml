name: Informe de error
description: Informa de un problema con el package o la tarjeta
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: No publiques contraseñas, tokens ni archivos HAR sin revisar.
  - type: input
    id: miner
    attributes:
      label: Modelo de Antminer
      placeholder: Antminer S19 Pro
    validations:
      required: true
  - type: input
    id: vnish
    attributes:
      label: Versión de VNish
      placeholder: 1.3.5
    validations:
      required: true
  - type: input
    id: homeassistant
    attributes:
      label: Versión de Home Assistant
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción y pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Registros o traza sin credenciales
      render: shell
